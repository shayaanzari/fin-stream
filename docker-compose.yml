services:
  # Off-the-shelf image
  postgres: # This is the name of the container, not a special keyword. Could be "db".
    image: postgres:16-alpine # Pinning version 16 ensures consistency across compose up and compose pull
    container_name: transact-db
    restart: unless-stopped # Other options: always, on-failure
    environment: # Defines environment variables est in the container
      POSTGRES_USER: ${POSTGRES_USER} # With password, used to define root user. Default: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD} # This is the only variable required; the rest are optional
      POSTGRES_DB: ${POSTGRES_DB} # Name for default database. Default: POSTGRES_USER
    ports:
      - "${POSTGRES_PORT}:5432" # Host Port : Container Port
    volumes:
      - postgres_data:/var/lib/postgresql/data # Named volume postgres_data is mounted to contianer path /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Custom Application: built from a Dockerfile
  bento:
    build:
      context: .
      dockerfile: Dockerfile.bento
    pull_policy: build
    container_name: transact-bento
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - stack.env
    ports:
      - "127.0.0.1:4195:4195"


  # Custom Application: built from a Dockerfile
  silver:
    build:
      context: .
      dockerfile: Dockerfile.silver
    #pull_policy: build
    container_name: transact-silver
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - stack.env
    environment:
      PREFECT_SERVER_EPHEMERAL_STARTUP_TIMEOUT_SECONDS: "60"
      PREFECT_API_DATABASE_CONNECTION_URL: "sqlite+aiosqlite:///:memory:"
      PREFECT_SERVER_ANALYTICS_ENABLED: "false"

  # Off-the-shelf image: Grafana Visualization & Dashboarding
  grafana:
    image: grafana/grafana-oss:11.1.0
    container_name: transact-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: # Create default local named volume called postgres_data if doesn't already exist
  grafana_data:
